<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Norte Pães</title>
<style>
:root{--ac:#1d4ed8;--bg:#fff;--tx:#0b0b0f;--mut:#5b6472;--card:#fff;--bd:#dbe3f0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
h1,h2,h3{font-family:Georgia,'Times New Roman',serif;margin:0}
a{color:var(--ac)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;background:#0b0b0f;position:sticky;top:0;z-index:5;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;font:600 20px Georgia,serif;color:#fff}.brand .muted{color:#fff}
.logo{height:52px;max-width:180px;object-fit:contain;background:#fff;border-radius:8px;padding:4px;display:block}
.logoph{height:52px;width:130px;border:2px dashed #5b6472;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;font:12px system-ui;color:#c9d3e6}
nav a{margin-left:14px;text-decoration:none;color:#fff;font-size:15px}
.wrap{max-width:1000px;margin:0 auto;padding:0 18px}
.hero{text-align:center;padding:64px 18px;background:linear-gradient(#fff,#e6eeff)}
.hero h2{font-size:clamp(28px,6vw,46px)}.hero p{color:var(--mut);max-width:560px;margin:12px auto 22px}
.btn{display:inline-block;background:var(--ac);color:#fff;border:0;border-radius:999px;padding:11px 22px;font:600 15px system-ui;text-decoration:none;cursor:pointer;margin:4px}
.btn.o{background:transparent;color:var(--ac);border:2px solid var(--ac)}
section{padding:42px 0}
section h2{font-size:28px;margin-bottom:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;font:inherit}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;height:170px;object-fit:cover}
.card div{padding:12px}.card h3{font-size:18px}.card p{margin:4px 0;color:var(--mut);font-size:14px}
.pr{font-weight:700;color:var(--ac)}.off{opacity:.55}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.info div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
footer{text-align:center;font-size:11px;color:#9aa4b5;background:#0b0b0f;padding:22px 10px;margin-top:20px}
.muted{color:var(--mut)}
#bar{position:fixed;right:14px;bottom:14px;display:flex;gap:8px;z-index:20}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;overflow:auto;padding:16px;display:none}
.ov .bx{background:var(--card);max-width:560px;margin:0 auto;border-radius:14px;padding:18px}
.bx input,.bx textarea,.bx select{width:100%;padding:9px;margin:4px 0 10px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:#fff;color:var(--tx)}
.bx label{font-size:13px;color:var(--mut)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--bd);padding:8px 0}
.sm{padding:5px 10px;font-size:13px;margin:0 0 0 4px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#2b2118;color:#fff;padding:9px 14px;border-radius:8px;display:none;z-index:50}
</style>
</head>
<body>
<header>
  <div class="brand" id="brand"></div>
  <nav id="nav"></nav>
</header>
<div class="hero"><h2 id="h_tag"></h2><p id="h_sub"></p><div id="h_btns"></div></div>
<main class="wrap">
  <section id="menu"><h2>Cardápio</h2><div class="chips" id="chips"></div><div class="grid" id="grid"></div></section>
  <section id="about"><h2>Sobre nós</h2><p id="about_t" style="white-space:pre-line"></p></section>
  <section id="contact"><h2>Contato</h2><div class="info" id="info"></div></section>
</main>
<footer id="foot"></footer>
<div id="bar"></div>

<div class="ov" id="lg"><div class="bx" style="max-width:360px"><h3>Acesso restrito</h3><br>
  <label>E-mail</label><input id="l_e" type="email" autocomplete="username">
  <label>Senha</label><input id="l_p" type="password" autocomplete="current-password">
  <div id="l_er" style="color:#c0392b;font-size:14px;min-height:20px"></div>
  <button class="btn" id="l_go">Entrar</button><button class="btn o" id="l_x">Cancelar</button></div></div>

<div class="ov" id="pn"><div class="bx">
  <div class="tabs"><button class="chip on" data-p="i">Informações</button><button class="chip" data-p="p">Produtos</button><button class="chip" id="p_x" style="margin-left:auto">Fechar ✕</button></div>
  <div id="pi">
    <label>Logo da padaria (PNG com fundo transparente é o ideal)</label><input id="f_logo" type="file" accept="image/*">
    <button class="btn o sm" id="f_rl" style="margin:0 0 10px">Remover logo</button><br>
    <label>Nome da padaria</label><input id="f_name">
    <label>Slogan</label><input id="f_tag">
    <label>Texto curto abaixo do slogan</label><input id="f_sub">
    <label>Sobre nós</label><textarea id="f_about" rows="4"></textarea>
    <label>Endereço</label><input id="f_addr">
    <label>Horário de funcionamento</label><textarea id="f_hours" rows="2"></textarea>
    <label>WhatsApp (com DDD, só números)</label><input id="f_wa" inputmode="numeric">
    <label>Instagram (@usuario)</label><input id="f_ig">
    <label>Cor principal</label><input id="f_col" type="color" style="height:42px">
    <button class="btn" id="f_save">Salvar informações</button>
  </div>
  <div id="pp" style="display:none">
    <h3 id="pf_t">Novo produto</h3>
    <label>Nome</label><input id="p_name">
    <label>Categoria (ex.: Pães, Doces, Bolos)</label><input id="p_cat">
    <label>Preço (ex.: R$ 8,50)</label><input id="p_price">
    <label>Descrição</label><textarea id="p_desc" rows="2"></textarea>
    <label>Foto (opcional)</label><input id="p_img" type="file" accept="image/*">
    <label><input id="p_av" type="checkbox" checked style="width:auto"> Disponível</label><br><br>
    <button class="btn" id="p_save">Salvar produto</button><button class="btn o" id="p_new">Limpar</button>
    <h3 style="margin-top:20px">Produtos cadastrados</h3><div id="pl"></div>
  </div>
</div></div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// COLE AQUI a configuração do Firebase do cliente
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBSkfqwpnGfaPtA2xi4cyPpc8KJqB_TGqA",
  authDomain: "nortepaes-c95ae.firebaseapp.com",
  projectId: "nortepaes-c95ae",
  storageBucket: "nortepaes-c95ae.firebasestorage.app",
  messagingSenderId: "1045224066552",
  appId: "1:1045224066552:web:9fba82b1990aa82c061a0d"
};

let db, auth, cfg = {}, prods = [], cat = '', admin = false, editId = null, logoNew = null, prodImg = '';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){ const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 3000); }
function shrink(file, max, type){
  return new Promise((res, rej) => {
    const im = new Image(), u = URL.createObjectURL(file);
    im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      const g = c.getContext('2d'); if (type === 'jpeg'){ g.fillStyle = '#fff'; g.fillRect(0,0,c.width,c.height); }
      g.drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      res(c.toDataURL('image/' + type, 0.8));
    };
    im.onerror = rej; im.src = u;
  });
}

function boot(){
  render();
  try {
    if (FIREBASE_CONFIG.apiKey === 'COLE_AQUI') throw 0;
    firebase.initializeApp(FIREBASE_CONFIG); db = firebase.firestore(); auth = firebase.auth();
  } catch(e){ setTimeout(checkHash, 300); return; }
  db.doc('site/config').onSnapshot(d => { cfg = d.exists ? d.data() : {}; render(); });
  db.collection('products').onSnapshot(s => { prods = s.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => (a.category||'').localeCompare(b.category||'') || (a.name||'').localeCompare(b.name||'')); render(); if ($('#pn').style.display === 'block') listProds(); });
  auth.onAuthStateChanged(u => { admin = !!u; if (admin) $('#lg').style.display = 'none'; render(); checkHash(); });
  checkHash();
}
function showLogin(){ if (!db){ toast('O Firebase não conectou. Confira a configuração.'); return; } $('#lg').style.display = 'block'; }
function checkHash(){ if (location.hash.toLowerCase() === '#admin'){ if (admin) openPanel(); else showLogin(); } }
let taps = [];
$('#foot').onclick = () => { const n = Date.now(); taps = taps.filter(t => n - t < 3000); taps.push(n); if (taps.length >= 5){ taps = []; admin ? openPanel() : showLogin(); } };
window.addEventListener('hashchange', checkHash);

function render(){
  document.documentElement.style.setProperty('--ac', cfg.color || '#1d4ed8');
  const name = cfg.name || 'Norte Pães';
  document.title = name;
  const lg = cfg.logo ? `<img class="logo" alt="${esc(name)}" src="${esc(cfg.logo)}">` : `<div class="logoph">${admin ? '📷 Toque para enviar a logo' : 'Sua logo aqui'}</div>`;
  $('#brand').innerHTML = (admin ? `<label style="cursor:pointer" title="Trocar logo">${lg}<input type="file" id="q_logo" accept="image/*" hidden></label>` : lg) + (cfg.logo ? '' : `<span>${esc(name)}</span>`);
  if (admin) $('#q_logo').onchange = async e => { const f = e.target.files[0]; if (!f) return; try { const d = await shrink(f, 400, 'png'); await db.doc('site/config').set({logo: d}, {merge: true}); toast('Logo atualizada para todos! ✅'); } catch(x){ toast('Não foi possível enviar a logo.'); } };
  const cats = [...new Set(prods.map(p => p.category).filter(Boolean))];
  $('#nav').innerHTML = (prods.length || admin ? '<a href="#menu">Cardápio</a>' : '') + (cfg.about ? '<a href="#about">Sobre</a>' : '') + '<a href="#contact">Contato</a>';
  $('#h_tag').innerHTML = cfg.tag ? esc(cfg.tag) : '<span class="muted">Seu slogan aqui</span>';
  $('#h_sub').textContent = cfg.sub || '';
  const wa = (cfg.wa || '').replace(/\D/g, '');
  $('#h_btns').innerHTML = `<a class="btn" href="#menu">Ver cardápio</a>` + (wa ? `<a class="btn o" target="_blank" rel="noopener" href="https://wa.me/${wa}">Pedir pelo WhatsApp</a>` : '');
  $('#menu').style.display = (prods.length || admin) ? '' : 'none';
  $('#chips').innerHTML = cats.length ? ['', ...cats].map(c => `<button class="chip ${cat === c ? 'on' : ''}" data-c="${esc(c)}">${c ? esc(c) : 'Todos'}</button>`).join('') : '';
  document.querySelectorAll('#chips .chip').forEach(b => b.onclick = () => { cat = b.dataset.c; render(); });
  const list = prods.filter(p => !cat || p.category === cat);
  $('#grid').innerHTML = list.length ? list.map(p => `<div class="card ${p.available === false ? 'off' : ''}">${p.img ? `<img alt="" src="${esc(p.img)}">` : ''}<div><h3>${esc(p.name)}</h3>${p.desc ? `<p>${esc(p.desc)}</p>` : ''}<span class="pr">${esc(p.price || '')}</span>${p.available === false ? ' <small>· indisponível</small>' : ''}</div></div>`).join('') : '<p class="muted">Nenhum produto cadastrado ainda.</p>';
  $('#about').style.display = cfg.about ? '' : 'none';
  $('#about_t').textContent = cfg.about || '';
  const ig = (cfg.ig || '').replace('@', '').trim();
  const box = (t, v) => v ? `<div><h3 style="font-size:16px">${t}</h3><p style="white-space:pre-line;margin:6px 0 0">${v}</p></div>` : '';
  const info = box('Endereço', esc(cfg.addr)) + box('Horário', esc(cfg.hours)) + box('WhatsApp', wa ? `<a target="_blank" rel="noopener" href="https://wa.me/${wa}">${esc(cfg.wa)}</a>` : '') + box('Instagram', ig ? `<a target="_blank" rel="noopener" href="https://instagram.com/${encodeURIComponent(ig)}">@${esc(ig)}</a>` : '');
  $('#contact').style.display = (info || admin) ? '' : 'none';
  $('#info').innerHTML = info || '<p class="muted">Preencha as informações no painel.</p>';
  $('#foot').textContent = `© ${new Date().getFullYear()} ${cfg.name || 'Norte Pães'} · direitos reservados`;
  $('#bar').innerHTML = admin ? '<button class="btn" id="b_ed">✏️ Editar site</button><button class="btn o" id="b_out" style="background:#fff">Sair</button>' : '';
  if (admin){ $('#b_ed').onclick = openPanel; $('#b_out').onclick = () => auth.signOut(); }
}

/* login */
$('#l_x').onclick = () => { $('#lg').style.display = 'none'; history.replaceState(null, '', location.pathname); };
$('#l_p').onkeydown = e => { if (e.key === 'Enter') $('#l_go').click(); };
$('#l_go').onclick = async () => {
  try { await auth.signInWithEmailAndPassword($('#l_e').value.trim(), $('#l_p').value); $('#lg').style.display = 'none'; $('#l_p').value = ''; openPanel(); }
  catch(e){ $('#l_er').textContent = 'E-mail ou senha incorretos.'; }
};

/* painel */
document.querySelectorAll('.tabs [data-p]').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs [data-p]').forEach(x => x.classList.toggle('on', x === b));
  $('#pi').style.display = b.dataset.p === 'i' ? '' : 'none';
  $('#pp').style.display = b.dataset.p === 'p' ? '' : 'none';
  if (b.dataset.p === 'p') listProds();
});
$('#p_x').onclick = () => { $('#pn').style.display = 'none'; history.replaceState(null, '', location.pathname); };
function openPanel(){
  if (!admin) return;
  $('#pn').style.display = 'block'; logoNew = null;
  $('#f_name').value = cfg.name || ''; $('#f_tag').value = cfg.tag || ''; $('#f_sub').value = cfg.sub || '';
  $('#f_about').value = cfg.about || ''; $('#f_addr').value = cfg.addr || ''; $('#f_hours').value = cfg.hours || '';
  $('#f_wa').value = cfg.wa || ''; $('#f_ig').value = cfg.ig || ''; $('#f_col').value = cfg.color || '#1d4ed8';
}
$('#f_logo').onchange = async e => { const f = e.target.files[0]; if (f) try { logoNew = await shrink(f, 400, 'png'); toast('Logo pronta. Toque em Salvar.'); } catch(x){ toast('Imagem inválida.'); } };
$('#f_rl').onclick = () => { logoNew = ''; toast('Logo será removida ao salvar.'); };
$('#f_save').onclick = async () => {
  const d = { name: $('#f_name').value.trim(), tag: $('#f_tag').value.trim(), sub: $('#f_sub').value.trim(), about: $('#f_about').value.trim(), addr: $('#f_addr').value.trim(), hours: $('#f_hours').value.trim(), wa: $('#f_wa').value.trim(), ig: $('#f_ig').value.trim(), color: $('#f_col').value };
  if (logoNew !== null) d.logo = logoNew;
  try { await db.doc('site/config').set(d, {merge: true}); toast('Salvo! ✅'); } catch(e){ toast('Erro ao salvar.'); }
};
function listProds(){
  $('#pl').innerHTML = prods.length ? prods.map(p => `<div class="row"><span>${esc(p.name)} <small class="muted">${esc(p.category || '')}</small></span><span><button class="btn o sm" data-e="${p.id}">Editar</button><button class="btn o sm" data-d="${p.id}" style="color:#c0392b;border-color:#c0392b">Excluir</button></span></div>`).join('') : '<p class="muted">Nenhum produto ainda.</p>';
  $('#pl').querySelectorAll('[data-e]').forEach(b => b.onclick = () => editProd(b.dataset.e));
  $('#pl').querySelectorAll('[data-d]').forEach(b => b.onclick = async () => { if (confirm('Excluir este produto?')) try { await db.doc('products/' + b.dataset.d).delete(); } catch(e){ toast('Erro ao excluir.'); } });
}
function clearProd(){ editId = null; prodImg = ''; $('#pf_t').textContent = 'Novo produto'; ['p_name','p_cat','p_price','p_desc'].forEach(i => $('#' + i).value = ''); $('#p_img').value = ''; $('#p_av').checked = true; }
function editProd(id){ const p = prods.find(x => x.id === id); if (!p) return; editId = id; prodImg = p.img || ''; $('#pf_t').textContent = 'Editando produto'; $('#p_name').value = p.name || ''; $('#p_cat').value = p.category || ''; $('#p_price').value = p.price || ''; $('#p_desc').value = p.desc || ''; $('#p_av').checked = p.available !== false; $('#pf_t').scrollIntoView(); }
$('#p_new').onclick = clearProd;
$('#p_img').onchange = async e => { const f = e.target.files[0]; if (f) try { prodImg = await shrink(f, 600, 'jpeg'); } catch(x){ toast('Imagem inválida.'); } };
$('#p_save').onclick = async () => {
  const name = $('#p_name').value.trim(); if (!name) return toast('Informe o nome.');
  const d = { name, category: $('#p_cat').value.trim(), price: $('#p_price').value.trim(), desc: $('#p_desc').value.trim(), img: prodImg, available: $('#p_av').checked };
  try { if (editId) await db.doc('products/' + editId).update(d); else await db.collection('products').add({...d, created: Date.now()}); toast('Produto salvo! ✅'); clearProd(); }
  catch(e){ toast('Erro ao salvar.'); }
};
boot();
</script>
</body>
</html>
